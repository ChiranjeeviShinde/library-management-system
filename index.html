<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Management System</title>
    <link rel="icon" href="./logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7eddc;
        --panel: rgba(111, 78, 55, 0.12);
        --panel-strong: rgba(255, 251, 243, 0.76);
        --card: rgba(255, 250, 241, 0.92);
        --border: rgba(88, 57, 38, 0.16);
        --text: #241a14;
        --muted: #6f5a49;
        --accent: #8f5a2c;
        --accent-dark: #553217;
        --accent-soft: #e5c49f;
        --success: #356648;
        --danger: #a14532;
        --shadow: 0 24px 60px rgba(65, 38, 17, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Manrope", sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at top left,
            rgba(255, 251, 241, 0.96),
            transparent 30%
          ),
          radial-gradient(
            circle at 80% 15%,
            rgba(193, 134, 80, 0.2),
            transparent 24%
          ),
          linear-gradient(135deg, #f6ecdd 0%, #ebdac3 50%, #dac0a1 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(84, 55, 32, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(84, 55, 32, 0.04) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.35),
          transparent 80%
        );
      }

      .shell {
        width: min(1200px, calc(100% - 32px));
        margin: 28px auto 40px;
        display: grid;
        gap: 24px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: 40px;
        border: 1px solid var(--border);
        border-radius: 32px;
        background:
          linear-gradient(
            135deg,
            rgba(255, 252, 246, 0.98),
            rgba(236, 217, 189, 0.88)
          ),
          linear-gradient(45deg, transparent, rgba(143, 90, 44, 0.06));
        box-shadow: var(--shadow);
      }

      .hero::after {
        content: "";
        position: absolute;
        right: -60px;
        top: -70px;
        width: 250px;
        height: 250px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(143, 90, 44, 0.3),
          transparent 65%
        );
      }

      .hero::before {
        content: "";
        position: absolute;
        left: 48%;
        bottom: -90px;
        width: 320px;
        height: 180px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(84, 51, 25, 0.12),
          transparent 70%
        );
      }

      .eyebrow {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--muted);
        margin-bottom: 10px;
      }

      h1 {
        margin: 0;
        max-width: 9ch;
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(3rem, 5vw, 5rem);
        line-height: 0.95;
        font-weight: 700;
      }

      .hero-copy {
        margin-top: 14px;
        max-width: 680px;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.02rem;
      }

      .hero-band {
        margin-top: 26px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border: 1px solid rgba(88, 57, 38, 0.12);
        border-radius: 999px;
        background: rgba(255, 249, 240, 0.7);
        color: var(--accent-dark);
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-top: 28px;
      }

      .stat {
        padding: 20px 22px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: rgba(255, 251, 245, 0.74);
        backdrop-filter: blur(8px);
      }

      .stat label {
        display: block;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .stat strong {
        font-size: clamp(1.7rem, 3vw, 2.4rem);
      }

      .grid {
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }

      .panel {
        padding: 24px;
        border-radius: 28px;
        border: 1px solid var(--border);
        background: var(--panel-strong);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .panel h2 {
        margin: 0 0 18px;
        font-family: "Cormorant Garamond", serif;
        font-size: 2rem;
        font-weight: 700;
      }

      .stack {
        display: grid;
        gap: 14px;
      }

      .card {
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: linear-gradient(
          180deg,
          rgba(255, 252, 247, 0.98),
          rgba(249, 239, 225, 0.96)
        );
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }

      .card h3 {
        margin: 0 0 12px;
        font-size: 1rem;
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 12px;
      }

      .field label {
        font-size: 0.88rem;
        color: var(--muted);
      }

      input,
      select {
        width: 100%;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid rgba(95, 64, 42, 0.16);
        background: rgba(255, 255, 255, 0.86);
        color: var(--text);
        font: inherit;
        outline: none;
        transition:
          border-color 180ms ease,
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      input:focus,
      select:focus {
        border-color: rgba(139, 94, 52, 0.6);
        box-shadow: 0 0 0 4px rgba(139, 94, 52, 0.12);
        transform: translateY(-1px);
      }

      button {
        border: 0;
        border-radius: 14px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        color: #fff7ef;
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        box-shadow: 0 10px 24px rgba(90, 60, 34, 0.24);
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          filter 180ms ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 26px rgba(90, 60, 34, 0.3);
        filter: saturate(1.05);
      }

      button.danger {
        background: linear-gradient(135deg, #b8543d, #7f2d1f);
      }

      .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 20px;
        padding: 16px;
        border: 1px solid rgba(88, 57, 38, 0.1);
        border-radius: 20px;
        background: rgba(255, 250, 243, 0.78);
      }

      .toolbar input {
        flex: 1 1 240px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: rgba(139, 94, 52, 0.12);
        color: var(--accent-dark);
      }

      .pill.issued {
        background: rgba(161, 69, 50, 0.14);
        color: var(--danger);
      }

      .books {
        display: grid;
        gap: 14px;
      }

      .book {
        position: relative;
        padding: 20px;
        border-radius: 24px;
        border: 1px solid rgba(88, 57, 38, 0.12);
        background: linear-gradient(
          180deg,
          rgba(255, 254, 250, 0.96),
          rgba(248, 239, 226, 0.94)
        );
        display: grid;
        gap: 14px;
        box-shadow: 0 14px 28px rgba(74, 44, 23, 0.08);
      }

      .book::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.24),
          transparent 38%
        );
      }

      .book-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: start;
      }

      .book-title {
        margin: 10px 0 0;
        font-size: 1.18rem;
        font-weight: 800;
      }

      .book-id-chip {
        display: inline-flex;
        margin-top: 10px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(143, 90, 44, 0.1);
        color: var(--accent-dark);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .shelf-mark {
        min-width: 88px;
        padding: 8px 10px;
        border-radius: 16px;
        background: rgba(255, 250, 242, 0.88);
        border: 1px solid rgba(88, 57, 38, 0.1);
        color: var(--muted);
        text-align: center;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .meta {
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.6;
      }

      .book-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .book-actions button.secondary {
        background: linear-gradient(135deg, #617257, #41513a);
      }

      .empty {
        padding: 36px 20px;
        border: 1px dashed rgba(95, 64, 42, 0.3);
        border-radius: 20px;
        text-align: center;
        color: var(--muted);
        background: rgba(255, 251, 245, 0.6);
      }

      .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 14px 18px;
        border-radius: 16px;
        color: #fff;
        background: rgba(47, 36, 29, 0.92);
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 960px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .stats {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100% - 20px, 1200px);
        }

        .hero,
        .panel {
          padding: 20px;
        }

        .toolbar {
          padding: 12px;
        }

        .book-top {
          flex-direction: column;
        }

        .book-actions button {
          width: 100%;
        }
      }

      .hero-header {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .logo {
        width: 60px;
        height: 60px;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      .logo svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .logo {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(6px);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="hero-header">
          <div class="logo">
            <svg viewBox="0 0 100 100">
              <rect width="100" height="100" rx="20" fill="#e8dccb" />
              <text
                x="50%"
                y="55%"
                text-anchor="middle"
                font-size="40"
                fill="#3b2f2f"
                font-family="Georgia"
                dy=".3em"
              >
                LM
              </text>
            </svg>
          </div>

          <h1>Library Management System</h1>
        </div>
        <div class="hero-band">Precision for every page.</div>
        <div class="stats">
          <div class="stat">
            <label>Total Books</label>
            <strong id="totalCount">0</strong>
          </div>
          <div class="stat">
            <label>Available</label>
            <strong id="availableCount">0</strong>
          </div>
          <div class="stat">
            <label>Issued</label>
            <strong id="issuedCount">0</strong>
          </div>
        </div>
      </section>

      <section class="grid">
        <aside class="panel">
          <h2>Manage Collection</h2>
          <div class="stack">
            <form id="addBookForm" class="card">
              <h3>Add Book</h3>
              <div class="field">
                <label for="bookId">Book ID</label>
                <input
                  id="bookId"
                  name="bookId"
                  type="number"
                  min="1"
                  required
                />
              </div>
              <div class="field">
                <label for="bookTitle">Title</label>
                <input id="bookTitle" name="bookTitle" type="text" required />
              </div>
              <div class="field">
                <label for="bookAuthor">Author</label>
                <input id="bookAuthor" name="bookAuthor" type="text" required />
              </div>
              <button type="submit">Add to Library</button>
            </form>

            <form id="issueBookForm" class="card">
              <h3>Issue Book</h3>
              <div class="field">
                <label for="issueBookId">Book ID</label>
                <input
                  id="issueBookId"
                  name="issueBookId"
                  type="number"
                  min="1"
                  required
                />
              </div>
              <div class="field">
                <label for="issueRegNo">Student Registration No.</label>
                <input
                  id="issueRegNo"
                  name="issueRegNo"
                  type="number"
                  min="1"
                  required
                />
              </div>
              <button type="submit">Issue Book</button>
            </form>

            <form id="returnBookForm" class="card">
              <h3>Return Book</h3>
              <div class="field">
                <label for="returnBookId">Book ID</label>
                <input
                  id="returnBookId"
                  name="returnBookId"
                  type="number"
                  min="1"
                  required
                />
              </div>
              <button type="submit">Return to Shelf</button>
            </form>
          </div>
        </aside>

        <section class="panel">
          <h2>Catalogue</h2>
          <div class="toolbar">
            <input
              id="searchInput"
              type="text"
              placeholder="Search by ID, title, or author"
            />
            <select id="filterSelect" aria-label="Filter books">
              <option value="all">All Books</option>
              <option value="available">Available Only</option>
              <option value="issued">Issued Only</option>
            </select>
          </div>
          <div id="bookList" class="books"></div>
        </section>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./index.js"></script>
  </body>
</html>
